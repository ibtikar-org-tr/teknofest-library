name: (main) [kitchen-backend] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'kitchen-backend/**'
      - '.github/workflows/kitchen-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: ./kitchen-backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $kitchenDbId
          | .d1_databases[0].database_name = $kitchenDbName
          | .d1_databases[1].database_id = $vmsDbId
          | .d1_databases[1].database_name = $vmsDbName
          | .d1_databases[1].remote = true
          | .vars.APP_NAME = $appName
          | .vars.VMS_API_BASE = $vmsApiBase
          | .services = [{binding: "LIBRARY", service: $libraryServiceName, remote: true}]
          | .account_id = $accountId
          | del(.vars.JWT_SECRET, .vars.VMS_INTERNAL_SECRET, .vars.LIBRARY_API_BASE)'

          jq \
            --arg kitchenDbId "${{ vars.KITCHEN_DB_ID }}" \
            --arg kitchenDbName "${{ vars.KITCHEN_DB_NAME }}" \
            --arg vmsDbId "${{ vars.VMS_DB_ID }}" \
            --arg vmsDbName "${{ vars.VMS_DB_NAME }}" \
            --arg appName "${{ vars.KITCHEN_BE_NAME }}" \
            --arg vmsApiBase "${{ vars.VMS_API_BASE }}" \
            --arg libraryServiceName "${{ vars.LIBRARY_BE_NAME }}" \
            --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.local.jsonc --name ${{ vars.KITCHEN_BE_NAME }}

      - name: Set secrets in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.JWT_SECRET }}" | wrangler secret put JWT_SECRET --config wrangler.local.jsonc --name ${{ vars.KITCHEN_BE_NAME }}
          echo "${{ secrets.VMS_INTERNAL_SECRET }}" | wrangler secret put VMS_INTERNAL_SECRET --config wrangler.local.jsonc --name ${{ vars.KITCHEN_BE_NAME }}
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "${{ secrets.DEEPSEEK_API_KEY }}" | wrangler secret put DEEPSEEK_API_KEY --config wrangler.local.jsonc --name ${{ vars.KITCHEN_BE_NAME }}
          fi
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
            echo "${{ secrets.SMTP_PASSWORD }}" | wrangler secret put SMTP_PASSWORD --config wrangler.local.jsonc --name ${{ vars.KITCHEN_BE_NAME }}
          fi

      - name: Migrate Kitchen D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler d1 migrations apply ${{ vars.KITCHEN_DB_NAME }} --remote --config wrangler.local.jsonc
