name: (main) [library-be-main-hono] Deploy Library Backend via Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'library-be-main-hono/**'
      - .github/workflows/library-be-hono.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Library Backend Microservice
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: install project dependencies
        run: |
          cd library-be-main-hono
          npm install
          npm run cf-typegen

      - name: Update wrangler config with environment variables
        run: |
          cd library-be-main-hono
          # Update wrangler.jsonc with environment variables using sed
          sed -i "s|\"database_id\":[[:space:]]*\"[^\"]*\"|\"database_id\": \"${{ vars.CLOUDFLARE_D1_DATABASE_ID }}\"|g" wrangler.jsonc

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd library-be-main-hono
          wrangler deploy