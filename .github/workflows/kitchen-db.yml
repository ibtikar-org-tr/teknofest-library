name: (main) [kitchen-db] Migrate Kitchen D1

on:
  push:
    branches:
      - main
    paths:
      - 'kitchen-backend/migrations/**'
      - '.github/workflows/kitchen-db.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: ./kitchen-backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Update wrangler config with environment variables
        run: |
          jq_filter='.d1_databases[0].database_id = $kitchenDbId
          | .d1_databases[0].database_name = $kitchenDbName
          | .d1_databases[1].database_id = $vmsDbId
          | .d1_databases[1].database_name = $vmsDbName
          | .d1_databases[1].remote = true
          | .account_id = $accountId'

          jq \
            --arg kitchenDbId "${{ vars.KITCHEN_DB_ID }}" \
            --arg kitchenDbName "${{ vars.KITCHEN_DB_NAME }}" \
            --arg vmsDbId "${{ vars.VMS_DB_ID }}" \
            --arg vmsDbName "${{ vars.VMS_DB_NAME }}" \
            --arg accountId "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" \
            "$jq_filter" \
            wrangler.jsonc > wrangler.local.jsonc

      - name: Migrate Kitchen D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler d1 migrations apply ${{ vars.KITCHEN_DB_NAME }} --remote --config wrangler.local.jsonc
