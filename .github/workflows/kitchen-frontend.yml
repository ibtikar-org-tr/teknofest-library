name: (master) [kitchen-frontend] Kitchen Frontend Deployment

on:
  push:
    branches:
      - master
    paths:
      - 'kitchen-frontend/**'
      - '.github/workflows/kitchen-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: master
    defaults:
      run:
        working-directory: ./kitchen-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Build the frontend
        env:
          VITE_API_TARGET: ${{ vars.VITE_API_TARGET }}
        run: npm run build

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler deploy