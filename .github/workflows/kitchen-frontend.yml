name: (main) [kitchen-frontend] Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'kitchen-frontend/**'
      - '.github/workflows/kitchen-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: ./kitchen-frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build the frontend
        env:
          VITE_API_TARGET: ${{ vars.VMS_URL }}/ms/kitchen
          VITE_VMS_LOGIN_URL: ${{ vars.VMS_URL }}/login
          VITE_LIBRARY_URL: ${{ vars.LIBRARY_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --name ${{ vars.KITCHEN_FE_NAME }}
